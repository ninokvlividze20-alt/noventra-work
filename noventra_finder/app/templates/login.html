<div class="w-full max-w-md mx-auto p-8 bg-[#0A0A0A] text-white min-h-screen flex flex-col justify-center">
    <h1 class="text-2xl font-bold mb-6 text-center">ავტორიზაცია</h1>
    <form action="/login" method="POST" class="space-y-4">
        <input type="text" name="username" placeholder="მომხმარებლის სახელი" required 
               class="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl outline-none">
        <input type="password" name="password" placeholder="პაროლი" required 
               class="w-full p-3 bg-gray-900 border border-gray-700 rounded-xl outline-none">
        <button type="submit" class="w-full p-3 bg-blue-600 rounded-xl font-bold hover:bg-blue-700 transition">
            შესვლა
        </button>
    </form>
    <p class="text-center mt-4 text-gray-400 text-sm">
        არ გაქვს ანგარიში? <a href="/register" class="text-blue-500 hover:underline">დარეგისტრირდი</a>
    </p>
</div>
