<div class="flex items-center justify-center min-h-[500px] p-4">
    <!-- მთავარი კონტეინერი -->
    <div class="relative w-full max-w-lg bg-[#0A0A0A]/80 backdrop-blur-xl border border-gray-800/50 p-8 rounded-[2.5rem] shadow-[0_0_50px_-12px_rgba(0,0,0,0.5)]">
        
        <!-- დეკორატიული გრადიენტური ლაქა (ბეგრაუნდის ეფექტი) -->
        <div class="absolute -top-20 -right-20 w-64 h-64 bg-blue-600/10 blur-[100px] rounded-full"></div>

        <!-- ჰედერი -->
        <div class="flex justify-between items-center mb-10">
            <div>
                <p class="text-blue-500 font-bold text-xs uppercase tracking-[0.2em] mb-1">სარეკლამო სლოტი</p>
                <h1 class="text-white text-4xl font-bold tracking-tight">ID: {{ slot_id }}</h1>
            </div>
            <button hx-get="/" hx-target="#content" hx-swap="innerHTML" 
                    class="group flex items-center justify-center w-12 h-12 rounded-full bg-gray-900 border border-gray-800 hover:border-gray-600 transition-all">
                <span class="text-gray-400 group-hover:text-white transition">✕</span>
            </button>
        </div>

        <!-- ფორმის სექცია -->
        <form action="/save-ad/{{ slot_id }}" method="POST" class="space-y-8">
            <div class="space-y-3">
                <label class="text-sm text-gray-400 ml-2">განათავსე შენი რეკლამა აქ</label>
                <input type="text" name="ad_text" placeholder="მაგ: Noventra Tech Solutions..." 
                       class="w-full p-6 bg-black/40 border border-gray-800 rounded-[1.5rem] text-white text-lg placeholder:text-gray-700 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-500/10 transition-all shadow-inner">
            </div>

            <!-- ღილაკი -->
            <button type="submit" 
                    class="w-full group relative bg-gradient-to-r from-blue-600 to-blue-700 text-white font-bold py-6 rounded-[1.5rem] hover:from-blue-500 hover:to-blue-600 shadow-[0_10px_20px_-5px_rgba(37,99,235,0.3)] transition-all active:scale-[0.98]">
                <span class="text-lg">ცვლილებების შენახვა</span>
            </button>
        </form>

        <!-- ფუტერი -->
        <div class="mt-12 flex justify-center">
            <a href="/logout" class="text-gray-600 hover:text-red-500 text-sm font-medium transition-colors">
                სისტემიდან გასვლა
            </a>
        </div>
    </div>
</div>
