<!-- app/templates/register_ad.html -->
<div class="p-6">
    <h2 class="text-2xl font-bold text-white mb-6">აირჩიეთ სარეკლამო სლოტი</h2>
    
    <div class="grid grid-cols-2 md:grid-cols-5 lg:grid-cols-10 gap-2">
        {% for i in range(1, 51) %}
            <div hx-get="/ad-slot/{{ i }}" 
                 hx-target="#content" 
                 hx-swap="innerHTML"
                 class="h-24 bg-gray-900 border border-gray-700 rounded-lg flex flex-col items-center justify-center cursor-pointer hover:border-yellow-500 transition-all group">
                <span class="text-2xl text-gray-600 group-hover:text-yellow-500 transition-colors">+</span>
                <span class="text-[9px] text-gray-500 mt-1">Slot #{{ i }}</span>
            </div>
        {% endfor %}
    </div>
</div>
