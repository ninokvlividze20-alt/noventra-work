{% extends 'base.html' %}
{% block content %}
<style>
    .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 20px; margin-top: 20px; }
    .card { background: #111118; padding: 22px; border-radius: 16px; border: 1px solid #222233; box-shadow: 0 8px 30px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, #00ffcc, #ffcc00); }
    .card h3 { color: #00ffcc; margin-top: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .btn { display: inline-block; padding: 12px 20px; border-radius: 10px; text-decoration: none; font-weight: bold; transition: 0.3s; position: relative; cursor: pointer; text-align: center; }
    .btn-primary { background: #00ffcc; color: #000; border: none; width: 100%; }
    .btn-danger { background: #ff4757; color: #fff; border: none; width: 100%; }
    .btn-warning { background: linear-gradient(135deg, #ffcc00, #ff9900); color: #000; border: none; width: 100%; font-weight: bold; }
    .board-card { border: 1px solid #00ffcc; background: #111118; padding: 20px; border-radius: 16px; text-align: center; margin-top: 20px; }
    .badge { background: #ff4757; color: white; border-radius: 50%; padding: 3px 7px; font-size: 11px; position: absolute; top: -4px; right: -4px; }
</style>
<h1 style="color: #fff; font-size: 22px; margin: 0;">⚡ მოთამაშე: <span style="color: #00ffcc;">{{ current_user.username }}</span></h1>
<div class="dashboard-grid">
    <div class="card" style="border-color: #ffcc00;">
        <h3 style="color: #ffcc00;">🏆 რეგიონების ბრძოლა (Live Arena)</h3>
        <p style="font-size: 13px; color: #a1a1aa; margin-bottom: 15px;">აირჩიე შენი რეგიონი და გაზარდე მისი რეიტინგი!</p>
        <div style="margin-bottom: 15px;">
            <select id="userRegionSelect">
                <option value="tbilisi">🏙️ თბილისი</option>
                <option value="imereti">⛰️ იმერეთი</option>
                <option value="adjara">🌊 აჭარის ა.რ.</option>
                <option value="kakheti">🍇 კახეთი</option>
                <option value="samegrelo">🌊 სამეგრელო-ზემო სვანეთი</option>
                <option value="guria">🌳 გურია</option>
                <option value="racha_lechkhumi">🏔️ რაჭა-ლეჩხუმი</option>
                <option value="samtskhe_javakheti">🏰 სამცხე-ჯავახეთი</option>
                <option value="shida_kartli">🌾 შიდა ქართლი</option>
                <option value="kvemo_kartli">⚒️ ქვემო ქართლი</option>
                <option value="mtskheta_mtianeti">⛪ მცხეთა-მთიანეთი</option>
                <option value="abkhazia">🌊 აფხაზეთის ა.რ.</option>
            </select>
        </div>
        <button onclick="boostRegion()" class="btn btn-warning">⚡ დააკლიკე და დაუმატე ქულა რეგიონს!</button>
        <div id="clickResponse" style="font-size: 13px; color: #00ffcc; text-align: center; margin-top: 10px; font-weight: bold;"></div>
    </div>
    <div class="card">
        <h3>💰 ციფრული საფულე</h3>
        <p style="color: #a1a1aa; font-size: 13px; margin: 5px 0;">მიმდინარე ბალანსი:</p>
        <div style="font-size: 30px; color: #00ffcc; font-weight: bold; margin-bottom: 5px;">{{ current_user.balance }} ₾</div>
        <form action="{{ url_for('request_withdrawal') }}" method="POST">
            <input type="number" name="amount" placeholder="თანხა (ლარი)" required min="1">
            <button type="submit" class="btn btn-danger">თანხის გატანის მოთხოვნა</button>
        </form>
    </div>
</div>
<div class="board-card">
    <a href="{{ url_for('board') }}" class="btn" style="background: #161622; border: 1px solid #00ffcc; color: #00ffcc;">💬 საჯარო დაფა</a>
    <div style="margin-top: 15px;"><a href="/logout" style="color: #ff4757; text-decoration: none; font-size: 13px;">🚪 გასვლა</a></div>
</div>
<script>
function boostRegion() {
    let regionId = document.getElementById('userRegionSelect').value;
    fetch('/api/score', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ region_id: regionId, points: 1 })
    })
    .then(response => response.json())
    .then(data => {
        if(data.success) {
            document.getElementById('clickResponse').innerText = "🔥 წარმატება! რეგიონის ქულა გაიზარდა (ჯამური: " + data.new_score + ")";
        }
    });
}
</script>
{% endblock %}
