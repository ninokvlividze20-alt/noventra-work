{% extends 'base.html' %}
{% block content %}
<style>
    .board-container { width: 100%; max-width: 480px; margin: 0 auto; }
    h3 { color: #00ffcc; font-size: 1.4rem; text-align: center; margin-bottom: 20px; }
    .back-btn { display: inline-block; color: #888; text-decoration: none; margin-bottom: 15px; font-size: 13px; }
    .post { background: #111118; border: 1px solid #222233; padding: 15px; margin-bottom: 15px; border-radius: 14px; }
    .post-text { color: #fff; font-size: 0.95rem; margin: 10px 0; }
    .btn-wa { display: block; width: 100%; background: #00d26a; color: #000; padding: 10px 0; text-align: center; text-decoration: none; border-radius: 8px; font-weight: bold; }
    textarea { width: 100%; min-height: 90px; background: #0f0f17; color: #fff; border: 1px solid #222233; border-radius: 10px; padding: 12px; box-sizing: border-box; }
</style>
<div class="board-container">
    <a href="{{ url_for('dashboard') }}" class="back-btn">← უკან დაშბორდზე</a>
    <h3>💬 საჯარო დაფა და დისკუსია</h3>
    <form method="POST">
        <textarea name="text" required placeholder="დასვი კითხვა..."></textarea>
        <button type="submit">გაგზავნა</button>
    </form>
    <hr style="border: 0; border-top: 1px solid #222233; margin: 25px 0;">
    {% for q in questions %}
    <div class="post">
        <div style="color: #888; font-size: 0.75rem;">ავტორი: <strong style="color: #00ffcc;">{{ q.username }}</strong></div>
        <div class="post-text">{{ q.text }}</div>
        <a href="https://wa.me/{{ q.user_phone }}" class="btn-wa" target="_blank">💬 WhatsApp-ით დაკავშირება</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
