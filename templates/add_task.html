{% extends 'base.html' %}
{% block content %}
<div style="max-width: 600px; margin: 40px auto; background: #111118; border: 1px solid #222233; border-radius: 16px; padding: 30px; color: #fff; box-shadow: 0 8px 30px rgba(0,0,0,0.5);">
    <h2 style="color: #00ffcc; margin-top: 0; margin-bottom: 20px;">➕ ახალი AI დავალების შექმნა</h2>
    
    <form method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        <div>
            <label style="display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 5px;">დავალების სათაური:</label>
            <input type="text" name="title" required class="input-field" style="background: #161622; border: 1px solid #33334d; color: #fff; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box;" placeholder="მაგ: შექმენი პითონის სკრიპტი...">
        </div>
        <div>
            <label style="display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 5px;">აღწერა / ინსტრუქცია:</label>
            <textarea name="description" rows="4" required style="background: #161622; border: 1px solid #33334d; color: #fff; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box;" placeholder="დაწვრილებით აღწერე დავალება..."></textarea>
        </div>
        <div>
            <label style="display: block; font-size: 13px; color: #a1a1aa; margin-bottom: 5px;">ჯილდო (GEL):</label>
            <input type="number" step="0.1" name="reward" value="5.0" required style="background: #161622; border: 1px solid #33334d; color: #fff; padding: 10px; border-radius: 8px; width: 100%; box-sizing: border-box;">
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button type="submit" style="background: #00ffcc; color: #000; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1;">შექმნა</button>
            <a href="{{ url_for('admin_dashboard') }}" style="background: #33334d; color: #fff; text-align: center; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: bold;">გაუქმება</a>
        </div>
    </form>
</div>
{% endblock %}
